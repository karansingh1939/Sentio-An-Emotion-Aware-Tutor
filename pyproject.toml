[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentio-tutor"
version = "2.0.0rc1"
description = "A local emotion-aware tutor with document-grounded study tools."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2,<3",
    "python-multipart>=0.0.18,<1",
    "python-dotenv>=1,<2",
    "numpy>=1.26,<3",
    "opencv-python>=4.8,<5",
    "tensorflow>=2.16,<3",
    "requests>=2.31,<3",
    "httpx>=0.27,<1",
    "sentence-transformers>=3,<6",
    "qdrant-client>=1.12,<2",
    "langgraph>=0.2,<2",
    "sqlalchemy>=2,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "pillow>=10,<13",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
ocr = ["pypdfium2>=5,<6"]
openai = ["openai>=1.30,<3"]
huggingface = ["accelerate>=0.29,<2"]
training = ["pandas>=2,<4", "matplotlib>=3.8,<4"]

[project.scripts]
sentio = "sentio.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.15,<1",
    "playwright>=1.48,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentio = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["browser: starts a real browser and API server", "live: requires local model inference"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
