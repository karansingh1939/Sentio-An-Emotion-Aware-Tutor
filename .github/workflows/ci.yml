name: Sentio Continuous Integration
on:
  push:
    branches: [main, master, sentio-v2-upgrade]
  pull_request:
    branches: [main, master, sentio-v2-upgrade]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: npm ci
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: npm run format:check
      - run: npm test
      - run: uv run python scripts/run_tests.py -q
