name: Feature request
description: Propose an improvement to the study workflow.
title: '[Feature]: '
body:
  - type: textarea
    id: need
    attributes:
      label: Learner problem
      description: Who needs this and what task is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe a concrete user outcome and how we could verify it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or existing workarounds
