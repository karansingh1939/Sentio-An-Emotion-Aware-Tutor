name: Bug report
description: Report a reproducible problem in the supported study workflow.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'Use sanitized examples. Do not include credentials, learner documents, or private logs. Report security concerns privately using SECURITY.md.'
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a minimal synthetic example when possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, OS, browser, local or Docker setup, and Ollama model if relevant.
    validations:
      required: true
